<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activate Your Device — Flow Focus Agent</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      justify-content: center;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .icon-badge {
      width: 48px;
      height: 48px;
      margin: 0 auto 14px;
      background-color: #0284c7;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }
    h2 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 8px 0;
      color: #f8fafc;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
      margin: 0;
    }
    .form-group {
      margin-top: 20px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: #38bdf8;
      font-family: monospace;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    button {
      margin-top: 24px;
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: none;
      background-color: #0284c7;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0369a1;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .error {
      color: #f87171;
      background-color: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 14px;
      display: none;
      text-align: center;
    }
    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon-badge">V</div>
    <h2>Activate Your Device</h2>
    <p>Paste the activation code provided in your onboarding email to register this device and start background monitoring.</p>
  </div>

  <div class="form-group">
    <label for="token">Activation Code</label>
    <input type="text" id="token" placeholder="Paste your activation code (e.g. ACT-8848-GUPB)" required autofocus />
  </div>

  <div id="error" class="error"></div>

  <button id="submitBtn" onclick="handleActivate()">Activate</button>

  <div class="footer">Flow Focus Desktop Agent &bull; VTAB SQUARE Security Telemetry</div>

  <script>
    async function handleActivate() {
      const tokenInput = document.getElementById("token");
      const token = tokenInput.value.trim();
      const errorEl = document.getElementById("error");
      const btn = document.getElementById("submitBtn");

      if (!token) {
        errorEl.textContent = "Please enter or paste your activation code.";
        errorEl.style.display = "block";
        return;
      }

      errorEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Activating...";

      try {
        // Use production server URL for the built agent
        const defaultServerUrl = "https://monitoring-tool-ve9o.onrender.com";
        const result = await window.electronAPI.registerToken(token, defaultServerUrl);
        if (!result.success) {
          errorEl.textContent = result.error || "Device activation failed. Please check your activation code.";
          errorEl.style.display = "block";
          btn.disabled = false;
          btn.textContent = "Activate";
        }
      } catch (err) {
        errorEl.textContent = "Network error connecting to activation server.";
        errorEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Activate";
      }
    }

    // Allow pressing Enter key to activate
    document.getElementById("token").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        handleActivate();
      }
    });
  </script>
</body>
</html>
